name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Inject Client ID
        run: |
          sed -i "s/___GOOGLE_CLIENT_ID___/${{ secrets.GOOGLE_CLIENT_ID }}/g" config.js

      # Stamp this commit onto every script URL in index.html and onto sw.js, which derives
      # its cache name from the same value. A page can then only load the scripts it shipped
      # with, instead of a fresh index.html pairing with a stale cached script. Both files
      # must get the same value, so they are substituted together here.
      - name: Inject build id
        run: |
          BUILD="${GITHUB_SHA::12}"
          sed -i "s/__BUILD__/${BUILD}/g" index.html sw.js
          echo "Build id: ${BUILD}"
          grep -c "?v=${BUILD}" index.html
          grep -n "const BUILD" sw.js

      - name: Syntax and test checks
        run: |
          for f in *.js; do
            node --check "$f"
          done
          node tests/email-parser.test.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
