name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Inject Client ID
        run: |
          sed -i "s/___GOOGLE_CLIENT_ID___/${{ secrets.GOOGLE_CLIENT_ID }}/g" config.js

      # Stamp this commit onto every script URL in index.html and onto sw.js, which derives
      # its cache name from the same value. A page can then only load the scripts it shipped
      # with, instead of a fresh index.html pairing with a stale cached script. Both files
      # must get the same value, so they are substituted together here.
      - name: Inject build id
        run: |
          BUILD="${GITHUB_SHA::12}"
          sed -i "s/__BUILD__/${BUILD}/g" index.html sw.js
          echo "Build id: ${BUILD}"
          grep -c "?v=${BUILD}" index.html
          grep -n "const BUILD" sw.js

      - name: Syntax and test checks
        run: |
          for f in *.js tests/*.js; do
            node --check "$f"
          done
          # index.html still carries hand-written inline <script> blocks (first-tap sign-in
          # escalation, the sidebar/Esc tail script). node --check only sees files, so a
          # syntax error in those shipped straight to production. Parse each inline block
          # with vm.Script, which uses sloppy mode — the same mode the browser parses a
          # classic script in, and looser than node --check's ES-module parse.
          node -e '
            const fs = require("fs"), vm = require("vm");
            // Strip HTML comments first: several of them talk about <script> tags, and
            // the extractor would otherwise try to parse prose as JavaScript.
            const html = fs.readFileSync("index.html", "utf8").replace(/<!--[\s\S]*?-->/g, "");
            const re = /<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g;
            let m, n = 0;
            while ((m = re.exec(html))) {
              if (!m[1].trim()) continue;
              n++;
              new vm.Script(m[1], { filename: "index.html inline script #" + n });
            }
            if (!n) { console.error("No inline scripts found — the extractor is broken, not the page."); process.exit(1); }
            console.log("Parsed " + n + " inline script block(s) in index.html");
          '
          node tests/email-parser.test.mjs
          node tests/email-import.test.mjs
          node tests/cc-usage.test.mjs

      # tests/ is dev-only (e2e seed page and fetch stubs) and `path: "."` would otherwise
      # publish it on the live site. Runs after the checks above so they still see it.
      - name: Drop dev-only files from the deploy
        run: rm -rf tests

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
